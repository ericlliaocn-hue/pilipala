name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test

  web:
    # web/bun.lock 只记录了 darwin-arm64 的原生包（rollup/esbuild/tailwind oxide），
    # Linux 上 frozen 安装拿不到原生二进制，构建失败；先跑在 macOS arm64 上，锁文件补全后再改回 ubuntu。
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # web/bun.lock 是 lockfileVersion 2，需要 bun 1.4+ 才能解析
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
